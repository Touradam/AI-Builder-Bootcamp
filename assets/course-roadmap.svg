<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">AI Education Program course roadmap</title>
  <desc id="desc">Course roadmap artwork. The live page shows the current cohort schedule in text.</desc>
  <defs>
    <linearGradient id="bgGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c0c0f"/>
      <stop offset="0.45" stop-color="#12121a"/>
      <stop offset="1" stop-color="#070708"/>
    </linearGradient>
    <radialGradient id="goldGlow" cx="50%" cy="35%" r="65%">
      <stop offset="0" stop-color="#c4a35a" stop-opacity="0.34"/>
      <stop offset="0.42" stop-color="#c4a35a" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#c4a35a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldStroke" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9a7b3c"/>
      <stop offset="0.48" stop-color="#e2c887"/>
      <stop offset="1" stop-color="#c4a35a"/>
    </linearGradient>
    <linearGradient id="cardGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f1f28"/>
      <stop offset="1" stop-color="#12121a"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#000000" flood-opacity="0.42"/>
    </filter>
    <filter id="goldBloom" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="dotGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#c4a35a" opacity="0.18"/>
    </pattern>
    <clipPath id="weekCardClip">
      <rect width="242" height="292" rx="22"/>
    </clipPath>
  </defs>

  <rect width="1600" height="900" fill="url(#bgGradient)"/>
  <rect width="1600" height="900" fill="url(#goldGlow)"/>
  <rect width="1600" height="900" fill="url(#dotGrid)" opacity="0.38"/>

  <g opacity="0.28" stroke="#c4a35a" stroke-width="1.2" fill="none">
    <path d="M-20 220 C180 155 330 165 500 230 S850 330 1040 235 1340 100 1620 170"/>
    <path d="M-20 760 C250 700 420 730 610 790 S970 880 1205 760 1450 620 1620 670"/>
    <path d="M1230 65 L1305 65 L1305 120 L1378 120"/>
    <path d="M116 705 L205 705 L205 650 L278 650"/>
    <circle cx="1378" cy="120" r="4" fill="#c4a35a"/>
    <circle cx="278" cy="650" r="4" fill="#c4a35a"/>
  </g>

  <g font-family="Outfit, DM Sans, Segoe UI, Arial, sans-serif">
    <text x="110" y="95" fill="#c4a35a" font-size="22" font-weight="700" letter-spacing="4">NOVEMBER FRIENDS COHORT</text>
    <text x="110" y="158" fill="#eceae4" font-size="58" font-weight="700" letter-spacing="-1.5">Four Sessions</text>
    <text x="110" y="203" fill="#b8b5ae" font-size="25">From the builder mindset to a live website.</text>

    <g transform="translate(1180 76)">
      <rect x="0" y="0" width="300" height="96" rx="24" fill="#18181f" stroke="#c4a35a" stroke-opacity="0.32"/>
      <text x="28" y="38" fill="#e2c887" font-size="25" font-weight="700">2 Weeks</text>
      <text x="28" y="72" fill="#eceae4" font-size="21">4 live sessions</text>
      <line x1="162" y1="22" x2="162" y2="74" stroke="#c4a35a" stroke-opacity="0.28"/>
      <text x="188" y="38" fill="#e2c887" font-size="25" font-weight="700">November</text>
      <text x="188" y="72" fill="#eceae4" font-size="21">2026 cohort</text>
    </g>
  </g>

  <path d="M201 486 C360 360 430 520 551 636 S760 400 901 486 S1100 700 1251 636" fill="none" stroke="#4b3d22" stroke-width="22" stroke-linecap="round" opacity="0.52"/>
  <path d="M201 486 C360 360 430 520 551 636 S760 400 901 486 S1100 700 1251 636" fill="none" stroke="url(#goldStroke)" stroke-width="8" stroke-linecap="round" filter="url(#goldBloom)"/>

  <g font-family="DM Sans, Segoe UI, Arial, sans-serif" filter="url(#softShadow)">
    <g transform="translate(80 340)" clip-path="url(#weekCardClip)">
      <rect width="242" height="292" rx="22" fill="url(#cardGradient)" stroke="#c4a35a" stroke-opacity="0.34"/>
      <circle cx="38" cy="42" r="24" fill="#c4a35a"/>
      <text x="38" y="49" text-anchor="middle" fill="#0c0c0f" font-size="20" font-weight="800">1</text>
      <text x="72" y="34" fill="#e2c887" font-size="11" font-weight="800" letter-spacing="1.2">NOV 14</text>
      <text x="72" y="52" fill="#eceae4" font-size="14" font-weight="800">
        <tspan x="72" dy="0">Become an</tspan>
        <tspan x="72" dy="16">AI Builder</tspan>
      </text>
      <text x="16" y="100" fill="#d8d5ce" font-size="11" font-weight="700">
        <tspan x="16" dy="0">Mindset, Cursor,</tspan>
        <tspan x="16" dy="14">web vocabulary</tspan>
      </text>
      <text x="16" y="150" fill="#9c9a94" font-size="12">Install the editor</text>
      <text x="16" y="170" fill="#9c9a94" font-size="12">HTML, CSS, JavaScript</text>
      <rect x="16" y="228" width="210" height="38" rx="12" fill="#c4a35a" fill-opacity="0.14" stroke="#c4a35a" stroke-opacity="0.28"/>
      <text x="121" y="244" text-anchor="middle" fill="#e2c887" font-size="10" font-weight="700">Outcome:</text>
      <text x="121" y="258" text-anchor="middle" fill="#e2c887" font-size="10" font-weight="700">editor ready</text>
    </g>

    <g transform="translate(430 490)" clip-path="url(#weekCardClip)">
      <rect width="242" height="292" rx="22" fill="url(#cardGradient)" stroke="#c4a35a" stroke-opacity="0.34"/>
      <circle cx="38" cy="42" r="24" fill="#c4a35a"/>
      <text x="38" y="49" text-anchor="middle" fill="#0c0c0f" font-size="20" font-weight="800">2</text>
      <text x="72" y="34" fill="#e2c887" font-size="11" font-weight="800" letter-spacing="1.2">NOV 15</text>
      <text x="72" y="52" fill="#eceae4" font-size="14" font-weight="800">
        <tspan x="72" dy="0">Prompting and</tspan>
        <tspan x="72" dy="16">First Builds</tspan>
      </text>
      <text x="16" y="100" fill="#d8d5ce" font-size="11" font-weight="700">
        <tspan x="16" dy="0">Three small apps</tspan>
        <tspan x="16" dy="14">and GitHub</tspan>
      </text>
      <text x="16" y="150" fill="#9c9a94" font-size="12">Calculator, timer, counter</text>
      <text x="16" y="170" fill="#9c9a94" font-size="12">First push to GitHub</text>
      <rect x="16" y="228" width="210" height="38" rx="12" fill="#c4a35a" fill-opacity="0.14" stroke="#c4a35a" stroke-opacity="0.28"/>
      <text x="121" y="244" text-anchor="middle" fill="#e2c887" font-size="10" font-weight="700">Outcome:</text>
      <text x="121" y="258" text-anchor="middle" fill="#e2c887" font-size="10" font-weight="700">code on GitHub</text>
    </g>

    <g transform="translate(780 340)" clip-path="url(#weekCardClip)">
      <rect width="242" height="292" rx="22" fill="url(#cardGradient)" stroke="#c4a35a" stroke-opacity="0.34"/>
      <circle cx="38" cy="42" r="24" fill="#c4a35a"/>
      <text x="38" y="49" text-anchor="middle" fill="#0c0c0f" font-size="20" font-weight="800">3</text>
      <text x="72" y="34" fill="#e2c887" font-size="11" font-weight="800" letter-spacing="1.2">NOV 21</text>
      <text x="72" y="52" fill="#eceae4" font-size="14" font-weight="800">
        <tspan x="72" dy="0">Your Website</tspan>
        <tspan x="72" dy="16">Goes Live</tspan>
      </text>
      <text x="16" y="100" fill="#d8d5ce" font-size="11" font-weight="700">
        <tspan x="16" dy="0">GitHub Pages</tspan>
        <tspan x="16" dy="14">with your media</tspan>
      </text>
      <text x="16" y="150" fill="#9c9a94" font-size="12">Site, portfolio, or card</text>
      <text x="16" y="170" fill="#9c9a94" font-size="12">One live update</text>
      <rect x="16" y="228" width="210" height="38" rx="12" fill="#c4a35a" fill-opacity="0.14" stroke="#c4a35a" stroke-opacity="0.28"/>
      <text x="121" y="244" text-anchor="middle" fill="#e2c887" font-size="10" font-weight="700">Outcome:</text>
      <text x="121" y="258" text-anchor="middle" fill="#e2c887" font-size="10" font-weight="700">website online</text>
    </g>

    <g transform="translate(1130 490)" clip-path="url(#weekCardClip)">
      <rect width="242" height="292" rx="22" fill="url(#cardGradient)" stroke="#c4a35a" stroke-opacity="0.34"/>
      <circle cx="38" cy="42" r="24" fill="#c4a35a"/>
      <text x="38" y="49" text-anchor="middle" fill="#0c0c0f" font-size="20" font-weight="800">4</text>
      <text x="72" y="34" fill="#e2c887" font-size="11" font-weight="800" letter-spacing="1.2">NOV 22</text>
      <text x="72" y="52" fill="#eceae4" font-size="14" font-weight="800">
        <tspan x="72" dy="0">Your Own</tspan>
        <tspan x="72" dy="16">Domain</tspan>
      </text>
      <text x="16" y="100" fill="#d8d5ce" font-size="11" font-weight="700">
        <tspan x="16" dy="0">Optional domain</tspan>
        <tspan x="16" dy="14">and mobile polish</tspan>
      </text>
      <text x="16" y="150" fill="#9c9a94" font-size="12">Hostinger, if you choose</text>
      <text x="16" y="170" fill="#9c9a94" font-size="12">Full update loop</text>
      <rect x="16" y="228" width="210" height="38" rx="12" fill="#c4a35a" fill-opacity="0.14" stroke="#c4a35a" stroke-opacity="0.28"/>
      <text x="121" y="244" text-anchor="middle" fill="#e2c887" font-size="10" font-weight="700">Outcome:</text>
      <text x="121" y="258" text-anchor="middle" fill="#e2c887" font-size="10" font-weight="700">a site you maintain</text>
    </g>
  </g>
</svg>
